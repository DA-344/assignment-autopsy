<svg class="w-full h-auto max-w-[320px] drop-shadow-2xl transition-transform duration-500 group-hover:scale-105" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
                        <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
                    </radialGradient>

                    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#38bdf8"/>
                        <stop offset="50%" stop-color="#6366f1"/>
                        <stop offset="100%" stop-color="#8b5cf6"/>
                    </linearGradient>

                    <linearGradient id="gradCap" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#334155"/>
                        <stop offset="100%" stop-color="#0f172a"/>
                    </linearGradient>

                    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
                        <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
                    </linearGradient>

                    <pattern id="aiGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.2"/>
                    </pattern>

                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                </defs>

                <circle cx="200" cy="200" r="180" fill="url(#bgGlow)"/>

                <g id="letter-a-group">
                    <path d="M200 70 L290 295 H245 L225 245 H175 L155 295 H110 L200 70 Z" fill="url(#gradA)" filter="url(#glow)"/>
                    <path d="M200 125 L182 205 H218 L200 125 Z" fill="#0f172a"/>
                    <path d="M200 70 L290 295 H245 L225 245 H175 L155 295 H110 L200 70 Z" fill="url(#aiGrid)" mix-blend-mode="overlay"/>
                </g>

                <g id="graduation-cap" transform="translate(0, -10)">
                    <polygon points="200,40 310,75 200,110 90,75" fill="url(#gradCap)" stroke="#64748b" stroke-width="2"/>
                    <path d="M142,92 V122 C142,135 258,135 258,122 V92" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
                    <circle cx="200" cy="75" r="5" fill="#facc15"/>
                    <path d="M200 75 Q240 100 270 125" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
                    <path d="M270 125 L265 140 M270 125 L275 140" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
                </g>

                <g id="magnifying-glass" transform="translate(30, 25)">
                    <polygon points="205,185 110,80 180,80" fill="#38bdf8" fill-opacity="0.12"/>

                    <rect x="75" y="240" width="30" height="75" rx="10" transform="rotate(-45 90 240)" fill="url(#gradCap)" stroke="#64748b" stroke-width="2.5"/>
                    <rect x="83" y="248" width="14" height="60" rx="5" transform="rotate(-45 90 240)" fill="#334155"/>

                    <circle cx="170" cy="170" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="6" filter="url(#glow)"/>
                    
                    <circle cx="170" cy="170" r="49" fill="url(#lensGrad)" stroke="#60a5fa" stroke-width="1.5"/>


                    <circle cx="170" cy="170" r="32" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>
                    <line x1="170" y1="135" x2="170" y2="205" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
                    <line x1="135" y1="170" x2="205" y2="170" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
                    <circle cx="170" cy="170" r="4" fill="#38bdf8"/>
                </g>

                <g id="ai-nodes">
                    <circle cx="100" cy="150" r="4" fill="#38bdf8" filter="url(#glow)"/>
                    <circle cx="280" cy="120" r="3" fill="#a855f7" filter="url(#glow)"/>
                    <circle cx="120" cy="270" r="3.5" fill="#6366f1" filter="url(#glow)"/>
                    <path d="M100 150 L125 180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
                    <path d="M280 120 L245 160" stroke="#a855f7" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
                </g>
            </svg>