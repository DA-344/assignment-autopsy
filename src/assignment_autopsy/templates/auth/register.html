{% extends 'base.html' %}{% block content %}<section class="card auth auth-discord"><h1>Crear cuenta</h1><p class="page-subtitle">Tu rol depende de cada equipo: creador como profesor, invitado como alumno.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><input type="hidden" name="next" value="{{next}}">
<div class="avatar-picker centered" data-avatar-picker><button type="button" class="avatar-circle" data-avatar-trigger aria-label="Elegir imagen"><span class="avatar-face" data-initial="+">+</span><span class="avatar-hover">Elegir imagen</span></button><input type="file" accept=".jpg,.jpeg,.png,.webp,image/png,image/jpeg,image/webp" hidden data-avatar-file><input type="file" name="avatar" hidden data-avatar-output></div>
<label>Nombre<input name="first_name" data-name required></label><label>Apellidos<input name="last_name" data-name required></label><label>Nombre de usuario<input name="username" data-username maxlength="30" placeholder="Elige tu GamerTag" required><span class="username-suggestions" data-suggestions></span></label><label>Correo electrónico<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="12" required></label><button>Registrarme</button></form><p class="auth-switch">¿Ya tienes cuenta? <a class="link" href="/login?next={{next}}">Inicia sesión</a></p></section>{% endblock %}
